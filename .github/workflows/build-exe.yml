name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build GUI executable
        run: pyinstaller --noconfirm --onefile --windowed --name DomainScan --collect-data tldextract main.py

      - name: Build CLI executable
        run: pyinstaller --noconfirm --onefile --console --name DomainScan-cli --collect-data tldextract main.py

      - name: Smoke test CLI
        run: .\dist\DomainScan-cli.exe --help

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DomainScan-windows
          path: dist/*.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
